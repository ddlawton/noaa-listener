name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Install dependencies
      run: |
        uv pip install --system -e .
        uv pip install --system pytest pytest-cov black flake8
    
    - name: Check code formatting
      run: black --check noaa_listener tests
      continue-on-error: true
    
    - name: Run linter
      run: flake8 noaa_listener --max-line-length=120 --extend-ignore=E203,W503
      continue-on-error: true
    
    - name: Run tests
      run: pytest tests/ -v --tb=short
    
  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t noaa-listener:test .
    
    - name: Test Docker image
      run: |
        docker run --rm noaa-listener:test python -c "import noaa_listener; print('Import successful')"
