[project]
name = "noaa-listener"
version = "1.0.0"
description = "NOAA Data Ingestion System for PostgreSQL"
authors = [
    { name = "ddlawton" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.23",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "APScheduler>=3.10.4",
    "pandas>=2.1.4",
    "numpy>=1.26.2",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.1",
    "flake8>=6.1.0",
    "mypy>=1.7.1"
]

[tool.setuptools]
packages = ["noaa_listener"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
